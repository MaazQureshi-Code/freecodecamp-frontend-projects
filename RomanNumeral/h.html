<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Numeral Converter</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Roman Numeral Converter</h1>
    <section class="input-container">
        <div>
            <label for="number-input">Enter a Number:</label>
            <input type="number" id="number" class="number-input" name="roman number input">
            <button id="convert-btn" class="convert-btn">Convert</button>
        </div>
    </section>
    <div id="output-container" >
        <p id="output"  class="output ">Please Enter a valid number</p>
    </div>
    <script src="./scripte.js"></script>
</body>
</html>
