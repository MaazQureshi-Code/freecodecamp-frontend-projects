<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telephone Number Validator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <div id="phone">
            <!-- Phone Notch with Camera -->
            <div class="notch">
                <div class="camera"></div>
            </div>

            <!-- Phone Screen -->
            <div class="screen " >
                <h1>Phone Validator</h1>
                <p>Enter a Phone Number:</p>
                <input type="text" id="user-input" placeholder="(555) 555-5555">
                <div class="results-div" id="results-div">
                    <p id="result-text" class="">Invalid US number</p>
                </div>
            </div>

            <!-- Phone Footer (Buttons) -->
            <div class="phone-footer">
                <button class="check-btn" id="check-btn">Check</button>
                <button class="clear-btn" id="clear-btn">Clear</button>
            </div>
        </div>       
    </main>
    <script src="./index.js"></script>
</body>
</html>
