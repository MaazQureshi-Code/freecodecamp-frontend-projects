<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>Cash Register Project</h1>
        <div id="change-due" bis_skin_checked="1"></div>
        <div class="input-div" bis_skin_checked="1">
            <label for="cash">Enter cash from customer:</label>
            <input type="number" id="cash" class="user-input" value="">
            <button class="check-btn-styles" id="purchase-btn">Purchase</button>
        </div>
        <div class="container" bis_skin_checked="1">
            <div class="top-display-screen-container" bis_skin_checked="1">
                <p id="price-screen" class="price-screen">Total: $3.26</p>
                <div class="connector" bis_skin_checked="1"></div>
            </div>
            <div class="top-register" bis_skin_checked="1">
                <div class="btns-container" bis_skin_checked="1">
                    <button class="btn"></button>
                    <button class="btn"></button>
                    <button class="btn"></button>
                    <button class="btn"></button>
                    <button class="btn"></button>
                    <button class="btn"></button>
                    <button class="btn"></button>
                    <button class="btn"></button>
                    <button class="btn"></button>
                </div>
                <div id="cash-drawer-display" class="cash-drawer-display" bis_skin_checked="1">
                    <p><strong>Change in drawer:</strong></p>
                    <p>Pennies: $1.01</p>
                    <p>Nickels: $2.05</p>
                    <p>Dimes: $3.1</p>
                    <p>Quarters: $4.25</p>
                    <p>Ones: $90</p>
                    <p>Fives: $55</p>
                    <p>Tens: $20</p>
                    <p>Twenties: $60</p>
                    <p>Hundreds: $100</p>
                </div>
            </div>
            <div class="bottom-register" bis_skin_checked="1">
                <div class="circle" bis_skin_checked="1"></div>
            </div>
        </div>
    </main>
    <script src="./index.js"></script>
</body>
</html>
